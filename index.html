<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iPhone のノッチ部分まで背景を広げるための指定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="英語学習の記録・発音練習と、指導者向けの管理ダッシュボード(試作版)" />

    <!--
      **この入り口のファイルは、古いものを使い回させない**(2026-08 実機)。

      中身(JS・CSS)はファイル名に印が付くので、新しくなれば必ず読み直される。
      ところが**この index.html だけは名前が変わらない**ため、
      端末に残った古いものがそのまま使われ、
      「直したはずの不具合が直っていない」が繰り返し起きた。
      実際、スマホに古い版が残っていて、
      新しく足した「接続を確かめる」ボタンが出ていなかった。
    -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <!--
      **ホーム画面に追加すると、ブラウザの枠がほぼ全部外れる**
      (2026-09 利用者の指定「ブラウザの機能をシャットアウトしたい」)。

      アドレスバーが消え、引っぱって更新も無くなる。
      **1段落ずつ調べる画面(`FocusReader`)には、これがいちばん効く。**
      指2本の拡大と、端からの戻るスワイプは iOS の仕様で止められないが、
      それ以外はここでまとめて外れる。

      `manifest.json` は Android(Chrome)側、`apple-` の3行は iPhone 側。
      **両方要る。** 片方だけでは片方の端末で効かない。
      道は相対(`start_url: "."`)にしてあるので、
      GitHub Pages のサブパスでもそのまま動く。
    -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="English AI" />
    <!-- **地色に合わせる。** `styles.css` を直したら、ここも直す
         (2026-08 に地色を変えたとき、ここが古いまま残っていた) -->
    <meta name="theme-color" content="#eaecef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)" />
    <title>English AI System</title>
  </head>
  <body>
    <!-- ここに React のアプリが描画されます -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
