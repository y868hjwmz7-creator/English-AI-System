<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iPhone のノッチ部分まで背景を広げるための指定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="英語学習の記録・発音練習と、指導者向けの管理ダッシュボード(試作版)" />

    <!--
      **この入り口のファイルは、古いものを使い回させない**(2026-08 実機)。

      中身(JS・CSS)はファイル名に印が付くので、新しくなれば必ず読み直される。
      ところが**この index.html だけは名前が変わらない**ため、
      端末に残った古いものがそのまま使われ、
      「直したはずの不具合が直っていない」が繰り返し起きた。
      実際、スマホに古い版が残っていて、
      新しく足した「接続を確かめる」ボタンが出ていなかった。
    -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <!-- iPhone で「ホーム画面に追加」したときに、アプリのように全画面で開く -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="English AI" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)" />
    <title>English AI System</title>
  </head>
  <body>
    <!-- ここに React のアプリが描画されます -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
