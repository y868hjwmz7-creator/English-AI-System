# ------------------------------------------------------------------
# このファイルの役目
#
# GitHub に変更が入るたびに、GitHub のサーバー上でアプリを組み立てて
# 「GitHub Pages」というウェブサイトとして公開します。
#
# つまり、あなたのパソコンには何もインストールしなくても、
# ブラウザで URL を開くだけでアプリを使えるようになります。
#
# 【最初に1回だけ必要な設定】
#   GitHub のリポジトリ画面 → Settings → Pages を開き、
#   「Source」を "GitHub Actions" に変更してください。
#   その後このワークフローが動くと、公開URLが表示されます。
#
#   公開URLの形: https://<あなたのユーザー名>.github.io/English-AI-System/
#
# 【注意】
#   GitHub Pages は公開ウェブサイトです。リポジトリが Private の場合、
#   無料プランでは Pages を使えません(Public にするか有料プランが必要)。
#   会社の情報を含めない試作段階のうちは Public でも問題ありませんが、
#   気になる場合は README の「1ファイル版」の方法をお使いください。
# ------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    # main だけでなく、作業用ブランチからも公開できるようにしています。
    # (main に取り込む前に、iPhone などの実機で動作を確認したいため)
    branches:
      - main
      - 'claude/**'
  workflow_dispatch: # GitHubの画面から手動で実行することもできます

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: アプリを組み立てる
        run: npm run build
        env:
          # GitHub Pages はリポジトリ名のフォルダの下で配信されるため、その指定
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: 診断ページに版を埋め込む
        # 古い内容がブラウザに残っていると、直したはずの不具合が
        # 直っていないように見える。どの版を見ているか分かるようにする。
        run: |
          STAMP="$(date -u '+%Y-%m-%d %H:%M') UTC / ${GITHUB_SHA:0:7}"
          sed -i "s|__BUILD_STAMP__|${STAMP}|g" dist/mic-test.html

      - name: 1ファイル版を組み立てる
        # ダウンロードして開くだけで使える版。公開物に download.html として含める。
        # (ビルド結果なのでリポジトリには置かず、ここで作る)
        run: |
          npm run build:single
          cp standalone/index.html dist/download.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
